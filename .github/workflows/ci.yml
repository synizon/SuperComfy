name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: bash -n *.sh supercomfy/lib/*.sh deploy/runpod/*.sh

      - name: Python syntax check
        run: python3 -m py_compile $(git ls-files '*.py')
